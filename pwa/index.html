<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1216">
<title>车钥匙 · bdb-PKE</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{--bg:#0f1216;--card:#171c23;--line:#242c36;--fg:#e6ebf2;--sub:#8b98a9;--accent:#4a9eff;--ok:#3ddc84;--warn:#ffb020;--err:#ff5a5f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;padding:14px 14px 28px;max-width:520px;margin:0 auto}
h1{font-size:18px;margin:0}
header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
header .sp{flex:1}
.pill{font-size:12px;border-radius:999px;padding:5px 10px;background:#1d2530;color:var(--sub);white-space:nowrap}
.pill.on{background:#123524;color:var(--ok)}
.pill.started{background:#3a2a12;color:var(--warn)}
.pill.off{background:#221a1c;color:var(--err)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:13px;color:var(--sub);font-weight:600;letter-spacing:.02em}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;border-radius:10px;border:1px solid var(--line);background:#1d2530;color:var(--fg);padding:10px 14px;cursor:pointer}
button:active:not(:disabled){background:#283444}
button:disabled{opacity:.4;cursor:default}
button.act{background:#1b3a5c;border-color:#2f6fb3;color:#eaf4ff}
button.ghost{background:#1a2028}
.grid{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin-bottom:10px}
.grid b{color:var(--sub);font-weight:500}
.keypad{position:relative;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px;width:100%;max-width:320px;margin:6px auto 12px;aspect-ratio:1/1}
.key{display:flex;align-items:center;justify-content:center;border-radius:22px;border:1px solid var(--line);background:#1a2028;color:var(--fg);font-size:16px;cursor:pointer;min-height:0;touch-action:manipulation;user-select:none}
.key:active:not(:disabled){background:#243040}
.key.start{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:104px;height:104px;border-radius:50%;font-size:17px;font-weight:600;background:radial-gradient(circle at 50% 35%,#3a1d20,#241417);border-color:#7a2a2f;color:#ff8b8f;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.key.start:active:not(:disabled){background:#4a2226}
.key.start.running{background:radial-gradient(circle at 50% 35%,#1d4a2a,#12301b);border-color:#3ddc84;color:#b8f5cf}
.hint{color:var(--sub);font-size:13px;margin-top:8px}
.warn{display:none;border:1px solid #7a2a2f;background:#241417;color:#ffb4b8;border-radius:12px;padding:12px;margin-bottom:12px;font-size:13px}
.warn code{background:#00000040;padding:1px 4px;border-radius:4px}
#log{white-space:pre-wrap;word-break:break-all;font:12px/1.45 ui-monospace,Consolas,monospace;color:#aab6c6;max-height:150px;overflow:auto;margin:0}
.small{font-size:12px;color:var(--sub);margin-top:8px}
</style>
</head>
<body>
<header>
  <h1>车钥匙</h1>
  <span class="pill off" id="status">未连接</span>
  <span class="sp"></span>
</header>

<div class="warn" id="scanNote">
  这个浏览器不支持 <b>Web Bluetooth</b>。请用 <b>Android Chrome</b> 打开，
  并且页面必须是 <b>HTTPS</b>（<code>http://局域网IP</code> 下浏览器会禁用蓝牙 API）。
</div>

<div class="card">
  <h2>报警器</h2>
  <div class="grid">
    <b>设备</b><span id="device">—</span>
  </div>
  <div class="row">
    <button class="act" id="connect">扫描并连接</button>
    <button class="ghost" id="disconnect" disabled>断开</button>
  </div>
  <div class="small">首次连接会弹出系统配对框，PIN <b>123789</b>；之后自动复用绑定。</div>
</div>

<div class="card">
  <h2>遥控</h2>
  <div class="keypad">
    <button class="key" data-action="lock" id="keyLock">上锁</button>
    <button class="key" data-action="unlock" id="keyUnlock">解锁</button>
    <button class="key" data-action="horn" id="keyHorn">响喇叭</button>
    <button class="key" data-action="mute" id="keyMute">静音</button>
    <button class="key start" data-action="start" id="keyStart">启动</button>
  </div>
  <div class="row">
    <button class="ghost" data-action="status" id="keyStatus">查询状态</button>
  </div>
  <div class="hint" id="hint"></div>
</div>

<div class="card">
  <h2>状态</h2>
  <div class="grid">
    <b>锁</b><span id="lock">未知</span>
    <b>车辆</b><span id="mode">未知</span>
    <b>密码位</b><span id="pass">—</span>
  </div>
</div>

<div class="card">
  <h2>日志</h2>
  <pre id="log"></pre>
</div>

<script type="module" src="app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
</script>
</body>
</html>
